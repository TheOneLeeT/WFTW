name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_target: windows
            artifact_name: WFTW-windows
            asset_name: WFTW-windows-x64.zip
          - os: macos-latest
            build_target: macos
            artifact_name: WFTW-macos
            asset_name: WFTW-macos-universal.tar.gz
          - os: ubuntu-latest
            build_target: linux
            artifact_name: WFTW-linux
            asset_name: WFTW-linux-x64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Linux dependencies
        if: matrix.build_target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with Flet
        env:
          FLET_CLI_NO_RICH_OUTPUT: 1
        run: |
          flet build ${{ matrix.build_target }} --module-name gui --yes
        shell: bash

      - name: Package Windows build
        if: matrix.build_target == 'windows'
        run: |
          mkdir -p release
          cp -r build/windows/* release/
          cd release
          zip -r ../WFTW-windows-x64.zip .
        shell: bash

      - name: Package macOS build
        if: matrix.build_target == 'macos'
        run: |
          mkdir -p release
          cp -r build/macos/* release/
          cd release
          tar -czf ../WFTW-macos-universal.tar.gz .
        shell: bash

      - name: Package Linux build
        if: matrix.build_target == 'linux'
        run: |
          mkdir -p release
          cp -r build/linux/* release/
          cd release
          tar -czf ../WFTW-linux-x64.tar.gz .
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            WFTW-*.zip
            WFTW-*.tar.gz
          compression-level: 9
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          
          # Windows
          if [ -f "artifacts/WFTW-windows/WFTW-windows-x64.zip" ]; then
              cp "artifacts/WFTW-windows/WFTW-windows-x64.zip" release/
          fi
          
          # macOS
          if [ -f "artifacts/WFTW-macos/WFTW-macos-universal.tar.gz" ]; then
              cp "artifacts/WFTW-macos/WFTW-macos-universal.tar.gz" release/
          fi
          
          # Linux
          if [ -f "artifacts/WFTW-linux/WFTW-linux-x64.tar.gz" ]; then
              cp "artifacts/WFTW-linux/WFTW-linux-x64.tar.gz" release/
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*
          draft: false
          prerelease: true
          generate_release_notes: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
