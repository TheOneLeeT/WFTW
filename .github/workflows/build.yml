name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_target: windows
            artifact_name: WFTW-windows
            asset_name: WFTW-windows-x64.exe
          - os: macos-latest
            build_target: macos
            artifact_name: WFTW-macos
            asset_name: WFTW-macos-universal.tar.gz
          - os: ubuntu-latest
            build_target: linux
            artifact_name: WFTW-linux
            asset_name: WFTW-linux-x64.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Linux dependencies
        if: matrix.build_target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with Flet
        env:
          FLET_CLI_NO_RICH_OUTPUT: 1
        run: |
          flet build ${{ matrix.build_target }} --module-name gui --artifact WFTW --description "Warframe Trade Watch" --yes
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            build/**/*
          compression-level: 9
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          
          # Windows - find and copy the main executable
          if [ -d "artifacts/WFTW-windows" ]; then
              exe=$(find artifacts/WFTW-windows -name "*.exe" -type f | head -1)
              if [ -n "$exe" ]; then
                  cp "$exe" release/WFTW-windows-x64.exe
              fi
          fi
          
          # macOS - create tar.gz from the app bundle
          if [ -d "artifacts/WFTW-macos" ]; then
              app_dir=$(find artifacts/WFTW-macos -name "*.app" -type d | head -1)
              if [ -n "$app_dir" ]; then
                  tar -czf release/WFTW-macos-universal.tar.gz -C "$(dirname "$app_dir")" "$(basename "$app_dir")"
              fi
          fi
          
          # Linux - find and copy the AppImage
          if [ -d "artifacts/WFTW-linux" ]; then
              appimage=$(find artifacts/WFTW-linux -name "*.AppImage" -type f | head -1)
              if [ -n "$appimage" ]; then
                  cp "$appimage" release/WFTW-linux-x64.AppImage
              fi
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release/*
          draft: false
          prerelease: true
          generate_release_notes: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
