name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build_target: windows
            artifact_name: WFTW-windows
            asset_name: WFTW-windows-x64.exe
          - os: macos-latest
            build_target: macos
            artifact_name: WFTW-macos
            asset_name: WFTW-macos-universal.tar.gz
          - os: ubuntu-latest
            build_target: linux
            artifact_name: WFTW-linux
            asset_name: WFTW-linux-x64.AppImage

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Linux dependencies
        if: matrix.build_target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev mesa-utils

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with Flet
        env:
          FLET_CLI_NO_RICH_OUTPUT: 1
        run: |
          flet build ${{ matrix.build_target }} --module-name gui --artifact WFTW --description "Warframe Trade Watch" --yes
        shell: bash

      - name: Package build output
        run: |
          python -c "
          import os, zipfile, tarfile, glob
          target = '${{ matrix.build_target }}'
          root = 'build'
          candidates = [d for d in os.listdir(root) if os.path.isdir(os.path.join(root, d))] if os.path.isdir(root) else []
          if not candidates:
              sys.exit(1)
          src = os.path.join(root, candidates[0])
          if target == 'windows':
              out = os.path.join(root, 'WFTW-windows-x64.zip')
              with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as zf:
                  for r, _, files in os.walk(src):
                      for f in files:
                          p = os.path.join(r, f)
                          zf.write(p, os.path.relpath(p, src))
          elif target == 'macos':
              out = os.path.join(root, 'WFTW-macos-universal.tar.gz')
              with tarfile.open(out, 'w:gz') as tf:
                  tf.add(src, arcname=os.path.basename(src))
          elif target == 'linux':
              out = os.path.join(root, 'WFTW-linux-x64.zip')
              with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as zf:
                  for r, _, files in os.walk(src):
                      for f in files:
                          p = os.path.join(r, f)
                          zf.write(p, os.path.relpath(p, src))
          "
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: build/WFTW-*
          compression-level: 9
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/*/build/WFTW-*.zip
            artifacts/*/build/WFTW-*.tar.gz
            artifacts/*/build/WFTW-*.AppImage
          draft: false
          prerelease: true
          generate_release_notes: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
